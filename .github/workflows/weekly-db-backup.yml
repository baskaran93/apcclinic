name: Weekly Database Backup

on:
  schedule:
    - cron: "0 3 * * 0" # Every Sunday 03:00 UTC (~08:30 IST)
  workflow_dispatch: {} # lets you trigger a test run manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL client (pg_dump)
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Run backup and email it
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_SMTP_USER: ${{ secrets.BACKUP_SMTP_USER }}
          BACKUP_SMTP_PASSWORD: ${{ secrets.BACKUP_SMTP_PASSWORD }}
          BACKUP_EMAIL_TO: ${{ secrets.BACKUP_EMAIL_TO }}
        run: python .github/scripts/backup_db.py
